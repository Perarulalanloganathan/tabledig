# Lab report test names.
Hemoglobin: [Haemoglobin, Hb, Hgb]
White blood cells: [WBC, Total leukocyte count, TLC, Leukocytes]
Red blood cells: [RBC, Total RBC count, Erythrocytes]
Platelets: [Platelet count, PLT, Thrombocytes]
Hematocrit: [Haematocrit, HCT, PCV, Packed cell volume]
Glucose: [Blood glucose, Fasting glucose, Blood sugar, FBS]
Cholesterol: [Total cholesterol, Serum cholesterol]
HDL cholesterol: [HDL, HDL-C, Good cholesterol]
LDL cholesterol: [LDL, LDL-C, Bad cholesterol]
Triglycerides: [TG, Serum triglycerides]
Creatinine: [Serum creatinine, S. creatinine]
Urea: [Blood urea, BUN, Blood urea nitrogen]
Bilirubin: [Total bilirubin, Serum bilirubin]
