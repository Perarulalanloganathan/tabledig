# Canonical row label -> other wordings seen in financial statements.
Revenue: [Revenue from operations, Total revenue, Net sales, Sales, Turnover, Total income from operations]
Net profit: [Profit for the year, Net income, Profit after tax, PAT, Net earnings, Profit for the period]
Gross profit: [Gross margin, Gross income]
Operating profit: [Operating income, EBIT, Profit from operations, Income from operations]
EBITDA: [Earnings before interest taxes depreciation and amortisation, Operating EBITDA]
Total assets: [Total Assets, Assets total]
Total liabilities: [Total Liabilities, Liabilities total]
Total equity: [Shareholders equity, Total shareholders equity, Stockholders equity, Net worth, Equity attributable to owners]
Cash and cash equivalents: [Cash and bank balances, Cash at bank and in hand, Cash and equivalents]
Depreciation: [Depreciation and amortisation, Depreciation and amortization, D&A]
Finance costs: [Interest expense, Finance expense, Interest and finance charges]
Income tax: [Tax expense, Provision for taxation, Income tax expense, Taxation]
Earnings per share: [EPS, Basic EPS, Basic earnings per share]
Dividend paid: [Dividends paid, Dividend, Dividends]
Capital expenditure: [Capex, Purchase of property plant and equipment, Additions to fixed assets]
