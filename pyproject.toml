[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabledig"
dynamic = ["version"]
description = "Pull named attributes (row labels) and their values out of table-style PDFs: financial statements, invoices, reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Perarulalan L" }]
keywords = ["pdf", "table-extraction", "data-extraction", "pdfplumber", "financial-statements"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing",
  "Intended Audience :: Developers",
]
dependencies = [
  "pdfplumber>=0.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
excel = ["pandas>=1.5", "openpyxl>=3.1"]
ocr = ["pytesseract>=0.3.10", "numpy>=1.21"]
mcp = ["mcp>=1.2"]
app = ["streamlit>=1.35", "pandas>=1.5", "openpyxl>=3.1"]
dev = ["pytest>=7", "reportlab>=4", "ruff>=0.4", "streamlit>=1.35", "pandas>=1.5", "pytesseract>=0.3.10", "numpy>=1.21", "jsonschema>=4", "mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/Perarulalanloganathan/tabledig"
Issues = "https://github.com/Perarulalanloganathan/tabledig/issues"
Changelog = "https://github.com/Perarulalanloganathan/tabledig/blob/main/CHANGELOG.md"

[project.scripts]
tabledig = "tabledig.cli:main"
tabledig-mcp = "tabledig.mcp_server:main"

[tool.hatch.version]
path = "src/tabledig/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tabledig"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/real_eval.py" = ["E501"]
"benchmarks/scan_eval.py" = ["E501"]  # long case tables and URLs read better unwrapped
