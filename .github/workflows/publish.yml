name: Publish to PyPI
# Runs when a GitHub release is published. Uses PyPI "trusted publishing" (no token stored here).
# One-time setup on pypi.org: Your projects > Publishing > add a pending publisher with
#   owner: Perarulalanloganathan, repository: tabledig, workflow: publish.yml, environment: pypi
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
